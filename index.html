<body data-scene="1">
  <div id="backdrop" aria-hidden="true">
    <div class="bg bg-1"></div><div class="bg bg-2"></div><div class="bg bg-3"></div><div class="bg bg-4"></div>
    <div class="bg bg-5"></div><div class="bg bg-6"></div><div class="bg bg-7"></div><div class="bg bg-8"></div>

  <header id="topbar">

  <button class="mute" type="button" aria-label="إيقاف الصوت" aria-pressed="false">
